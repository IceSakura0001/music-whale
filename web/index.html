<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0A1020"><title>Music Whale · 鲸歌 音乐工作台</title><meta name="description" content="Music Whale 鲸歌：点下灵感，拖出旋律的多轨音乐工作台。"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='11' fill='%230A1020'/%3E%3Cpath d='M7 23c0-6 5-10 11-10 6 0 10 3 11 7 2-1 4-3 4-5 2 5 0 11-5 14-3 2-6 2-10 2-7 0-11-3-11-8Z' fill='%234D6BFE'/%3E%3Ccircle cx='31' cy='24' r='1.6' fill='%230A1020'/%3E%3C/svg%3E"><link rel="stylesheet" href="/style.css"></head>
<body>
<svg class="sprite" aria-hidden="true"><defs>
<symbol id="i-play" viewBox="0 0 24 24"><path d="m9 5 11 7-11 7Z"/></symbol><symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol><symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol><symbol id="i-loop" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4M21 6H7a4 4 0 0 0-4 4m4 12-4-4 4-4M3 18h14a4 4 0 0 0 4-4"/></symbol>
<symbol id="i-undo" viewBox="0 0 24 24"><path d="m8 4-5 5 5 5M3 9h11a6 6 0 0 1 0 12"/></symbol><symbol id="i-redo" viewBox="0 0 24 24"><path d="m16 4 5 5-5 5M21 9H10a6 6 0 0 0 0 12"/></symbol>
<symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></symbol><symbol id="i-pencil" viewBox="0 0 24 24"><path d="m15 4 5 5M4 20l5-1L21 7l-5-5L4 14Z"/></symbol>
<symbol id="i-erase" viewBox="0 0 24 24"><path d="m13 3 8 8-10 10H5l-5-5ZM7 10l8 8M11 21h12"/></symbol><symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V3H3v13h5"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/></symbol><symbol id="i-headphones" viewBox="0 0 24 24"><path d="M4 14V11a8 8 0 0 1 16 0v3"/><rect x="2" y="12" width="5" height="9" rx="2"/><rect x="17" y="12" width="5" height="9" rx="2"/></symbol>
<symbol id="i-piano" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16m6-16v16M6 4v8m6-8v8m6-8v8"/></symbol><symbol id="i-drum" viewBox="0 0 24 24"><ellipse cx="12" cy="9" rx="9" ry="4"/><path d="M3 9v9c0 5 18 5 18 0V9M5 2l7 6m8-7-6 6M8 13v7m8-7v7"/></symbol>
<symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 2 3 7 7 3-7 3-3 7-3-7-7-3 7-3Z"/></symbol><symbol id="i-code" viewBox="0 0 24 24"><path d="m8 6-6 6 6 6m8-12 6 6-6 6M14 3l-4 18"/></symbol><symbol id="i-volume" viewBox="0 0 24 24"><path d="m4 9 5 0 5-5v16l-5-5H4Zm13-2a7 7 0 0 1 0 10m3-13a11 11 0 0 1 0 16"/></symbol>
</defs></svg>
<header class="topbar">
 <a class="brand" href="/" aria-label="Music Whale 首页"><span class="brand-mark"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 27c0-8 6-13 14-13 7 0 12 4 13 9 3-1 5-4 5-7 2 6 0 13-6 16-3 2-7 3-12 3-8 0-14-3-14-8Z" fill="currentColor"/><circle cx="37" cy="28" r="2.2" fill="#0A1020"/><path d="M20 28c2 2 6 2 8 0" stroke="#0A1020" stroke-width="1.6" fill="none"/></svg></span><span>MUSIC<span class="brand-light">WHALE</span><small>鲸歌 · 让灵感有声音</small></span></a>
 <div class="project-title"><input id="projectName" aria-label="乐曲名称" maxlength="120"><span id="saveStatus"><i></i> 正在载入</span><button id="projectMenuBtn" title="项目菜单" aria-label="项目菜单">⋯</button></div>
 <div class="header-actions"><button id="agentBtn" class="quiet"><svg><use href="#i-code"/></svg><span>Agent</span><b class="tiny-dot"></b></button><button id="helpBtn" class="icon-btn" title="操作帮助">?</button><button id="exportBtn" class="primary"><svg><use href="#i-download"/></svg>导出音乐</button></div>
</header>
<section class="transport" aria-label="播放控制">
 <div class="transport-main"><button id="stopBtn" class="icon-btn" title="停止并回到开头"><svg><use href="#i-stop"/></svg></button><button id="playBtn" class="play-btn" title="播放 / 暂停（空格）"><svg><use href="#i-play"/></svg><span>播放</span></button><button id="loopBtn" class="icon-btn active" title="循环播放"><svg><use href="#i-loop"/></svg></button><span class="separator"></span><div class="position"><b id="position">01 : 01</b><small>小节 · 拍</small></div></div>
 <div class="tempo"><label for="bpm">速度</label><button id="bpmMinus" aria-label="减慢 BPM">−</button><input id="bpm" type="number" min="40" max="240" value="112" aria-label="BPM"><span>BPM</span><button id="bpmPlus" aria-label="加快 BPM">+</button><button id="tapBtn" title="连续点击设定速度">TAP</button></div>
 <div class="transport-extra"><button id="metronomeBtn" class="quiet" title="节拍器（只用于试听）">♩ 节拍器</button><label>长度 <select id="bars" aria-label="小节数"></select></label><span class="meter">4/4</span><button id="undoBtn" class="icon-btn" title="撤销 Ctrl+Z"><svg><use href="#i-undo"/></svg></button><button id="redoBtn" class="icon-btn" title="重做 Ctrl+Shift+Z"><svg><use href="#i-redo"/></svg></button></div>
</section>
<div class="workspace">
 <aside class="track-panel"><div class="panel-heading"><span>音轨 <small id="trackCount">04</small></span><button id="addTrackBtn" class="icon-btn" title="添加音轨"><svg><use href="#i-plus"/></svg></button></div><div id="tracks"></div><button id="addTrackWide" class="add-track"><svg><use href="#i-plus"/></svg>添加乐器</button>
 <div class="sidebar-bottom"><div class="idea"><span>从一个音符开始</span><p>点击空白添加音符，<br>拖动它，听见新的可能。</p><button id="newBtn">新建空白乐曲 <span>↗</span></button></div><div class="project-files"><button id="saveProjectBtn">保存项目</button><button id="loadProjectBtn">打开项目</button><input id="fileInput" type="file" accept=".json,.muse,application/json" hidden></div><div class="master-control"><svg><use href="#i-volume"/></svg><input id="master" type="range" min="0" max="1" step=".01" aria-label="总音量"><span id="masterValue">75%</span></div></div></aside>
 <main class="main-panel">
  <section class="overview"><div class="section-title"><span>乐曲总览 <small>ARRANGEMENT</small></span><span id="songDuration"></span></div><div id="arrangement"></div></section>
  <section class="editor"><div class="editor-heading"><div><span class="track-color" id="selectedColor"></span><h1 id="editorTitle">柔和钢琴</h1><span class="tag" id="editorTag">钢琴卷帘</span></div><button id="soundToggle" class="quiet">音色设置 ☷</button></div>
   <div class="editor-toolbar"><div class="segmented"><button id="drawBtn" class="active" title="画笔：点击添加，拖动绘制长度"><svg><use href="#i-pencil"/></svg><span>画笔</span></button><button id="eraseBtn" title="橡皮：点击删除"><svg><use href="#i-erase"/></svg></button></div><label>吸附 <select id="snap" aria-label="音符吸附"><option value="1">1/4 拍格</option><option value=".5">1/8 拍格</option><option value=".25" selected>1/16 拍格</option><option value=".125">1/32 拍格</option></select></label><label id="octaveLabel">音域 <select id="octave" aria-label="音域"><option value="12">C0–B2</option><option value="24">C1–B3</option><option value="36">C2–B4</option><option value="48" selected>C3–B5</option><option value="60">C4–B6</option><option value="72">C5–B7</option><option value="84">C6–B8</option><option value="92">G♯6–G9</option><option value="0">C−1–B1</option></select></label><div class="toolbar-spacer"></div><button id="copyNotesBtn" class="icon-btn" title="复制选中音符 Ctrl+C"><svg><use href="#i-copy"/></svg></button><button id="deleteNotesBtn" class="icon-btn" title="删除选中音符 Delete"><svg><use href="#i-trash"/></svg></button><label class="zoom-label">−<input id="zoom" type="range" min="32" max="100" step="4" value="48" aria-label="时间轴缩放">+</label></div>
   <div class="roll-scroll" id="rollScroll"><div id="rollInner"><div class="ruler" id="ruler"></div><div class="roll-body"><div id="keys" class="keys"></div><div id="grid" class="note-grid" role="grid" aria-label="音符编辑区"><div id="noteLayer"></div><div id="playhead" class="playhead"></div></div></div></div></div>
   <div class="velocity"><div class="velocity-title"><span>力度 <small>VELOCITY</small></span><label id="velocityLabel"><span id="selectionLabel">未选中音符</span><input id="velocity" type="range" min=".01" max="1" step=".01" value=".75" aria-label="选中音符力度"></label></div><div id="velocityBars"></div></div>
  </section>
  <div class="editor-hint"><span><i class="mint-dot"></i> 点击添加 · 拖动移动 · 拖右边延长 · 右键删除</span><span>空格 播放 <kbd>⌘ / Ctrl</kbd> Z 撤销</span></div>
 </main>
 <aside class="inspector" id="inspector"><div class="panel-heading"><span>声音设计 <small>SOUND</small></span><svg><use href="#i-spark"/></svg></div><div class="inspector-content"><label class="field-label" for="trackName">音轨名称</label><input id="trackName" class="text-field" maxlength="60" aria-label="音轨名称"><div class="preset-card"><div class="preset-icon"><svg><use href="#i-piano"/></svg></div><label><small>当前音色</small><select id="preset" aria-label="乐器音色"></select></label></div><p class="muted-note" id="engineNote">加载音源…</p>
 <div class="mix-row"><label>音量 <output id="volumeValue"></output><input id="volume" type="range" min="0" max="1" step=".01"></label><label>声像 <output id="panValue"></output><input id="pan" type="range" min="-1" max="1" step=".01"></label></div>
 <div id="soundDesign">
 <div class="section-divider"></div><div class="mini-heading">振荡器 <small>OSCILLATOR</small></div><canvas id="waveCanvas" width="440" height="150" aria-label="波形预览"></canvas><div id="waveButtons" class="wave-buttons"><button data-wave="sine" title="正弦波">∿</button><button data-wave="triangle" title="三角波">△</button><button data-wave="sawtooth" title="锯齿波">⋀</button><button data-wave="square" title="方波">⊓</button><button data-wave="custom" title="自定义泛音">自定</button></div><div id="harmonics" class="harmonics"></div>
 <div class="mini-heading envelope-heading">音量包络 <small>ENVELOPE</small></div><div class="envelope-controls"><label>起音 <output id="attackValue"></output><input id="attack" type="range" min=".002" max="2" step=".002"></label><label>衰减 <output id="decayValue"></output><input id="decay" type="range" min=".01" max="3" step=".01"></label><label>延音 <output id="sustainValue"></output><input id="sustain" type="range" min="0" max="1" step=".01"></label><label>释音 <output id="releaseValue"></output><input id="release" type="range" min=".02" max="3" step=".01"></label></div><label class="slider-field">明亮度 <output id="cutoffValue"></output><input id="cutoff" type="range" min="100" max="20000" step="100"></label><label class="slider-field">厚度 / 失谐 <output id="detuneValue"></output><input id="detune" type="range" min="0" max="30" step="1"></label>
</div>
<div class="custom-actions" id="customActions" hidden><button id="saveInstrumentBtn">保存为我的音色</button><button id="deleteInstrumentBtn">删除音色</button></div>
<label class="slider-field">全局空间 <output id="reverbValue"></output><input id="reverb" type="range" min="0" max=".5" step=".01"></label><label class="slider-field">全局摇摆 <output id="swingValue"></output><input id="swing" type="range" min="0" max=".45" step=".01"></label>
<button id="previewBtn" class="audition"><svg><use href="#i-headphones"/></svg>试听当前音色</button><div class="track-actions"><button id="duplicateTrackBtn">复制音轨</button><button id="deleteTrackBtn">删除音轨</button></div></div></aside>
</div>
<footer><span>MUSIC WHALE <b>v1.2</b></span><span id="footerInfo">4 轨 · 4 小节 · C 大调灵感</span><span><i class="tiny-dot"></i><span id="connectionStatus">连接中</span></span></footer>
<div id="toast" class="toast" role="status"></div>
<dialog id="dialog"><div id="dialogContent"></div><button class="dialog-close" id="closeDialog" aria-label="关闭">×</button></dialog>
<script type="module" src="/app.js"></script>
</body></html>
